        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok([{id:'proj-1',name:fullProject.name,description:'',status:'active',createdAt:fullProject.createdAt,updatedAt:fullProject.updatedAt,_count:{modules:fullProject.modules.length,pages:fullProject.pages.length,fields:fullProject.fields.length,actions:fullProject.actions.length}}]);
      }
      // GET /api/projects/{id}
      if (u.match(/\/projects\/[\w-]+$/) && method==='GET') {
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok(fullProject);
      }
      // GET /api/edges/{pid} — return empty, edges come from project data
      if (u.includes('/edges/') && method==='GET') {
        return ok([]);
      }
      // GET /api/commits/{pid} — mock versions
      if (u.includes('/commits/') && method==='GET') {
        return ok(window._srCommits||[]);
      }
      // POST /api/commits/{pid} — create commit
      if (u.includes('/commits/') && method==='POST') {
        const body = JSON.parse(opts?.body||'{}');
        if (!window._srCommits) window._srCommits = []
        const v = window._srCommits.length + 1
        const commit = {id:'c'+v,version:v,message:body.message||'里程碑状态字段新增',createdAt:new Date().toISOString()}
        window._srCommits.push(commit)
        return ok(commit);
      }
      // POST /api/parse/{pid}
      if (u.includes('/parse/') && method==='POST') {
        await delay(800);
        return ok({entities:[{name:'新需求',type:'page',parentName:'项目管理'},{name:'影响字段',type:'field',parentName:'新需求',fieldType:'string'}]});
      }
      // POST /api/inference/impact
      if (u.includes('/inference/impact') && method==='POST') {
        await delay(1000);
        const reqText = getReqFromBodyOrDom(body);
        const ev = getEval(reqText);
        return ok({
          impactDescription: ev.impactDesc,
          newEntities: ev.newEntities,
          affectedEntities: ev.affectedEntities,
          newEdges: ev.newEdges,
        });
      }
      // POST /api/inference/refine — submit refine
      if (u.includes('/inference/refine') && method==='POST') {
        await delay(300);
        const body = JSON.parse(opts?.body||'{}');
        const reqText = getReqFromBodyOrDom(body);
        const ev = getEval(reqText);
        return ok({
          refinedText: ev.refineText,
          entities: ev.refineEntities,
          newEdges: ev.refineEdges,
        });
      }
      // GET/POST/PATCH/DELETE asset operations
      if (u.includes('/assets/')) {
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok({});
      }
      // POST /api/inference/apply-impact — apply changes
      if (u.includes('/apply-impact') && !u.includes('/apply-impact-status')) {
        await delay(500);
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        const requirement = getReqFromBodyOrDom(body);
        const ev = getEval(requirement);
        // Apply fields & edges from eval data (flat + nested module structure)
        const createdIds = [], createdEdgeIds = [];
        ev.applyFields.forEach(f => {
          fullProject.fields.push(f);
          createdIds.push(f.id);
          // Also add page/action/field to the nested module structure
          if (f.fieldType === 'page' && f.moduleId) {
            const mod = fullProject.modules.find(m => m.id === f.moduleId);
            if (mod) {
              const existing = mod.pages.find(p => p.id === f.id);
              if (!existing) mod.pages.push({id:f.id,name:f.name,moduleId:f.moduleId,posX:f.posX,posY:f.posY,fields:[],actions:[],pageId:f.pageId||f.id});
            }
          } else if (f.fieldType === 'action' && f.pageId) {
            // Find page in module structure and add action
            for (const mod of fullProject.modules) {
              const page = mod.pages.find(p => p.id === f.pageId || p.id === f.id || p.pageId === f.pageId);
              if (page) {
                const existing = page.actions.find(a => a.id === f.id);
                if (!existing) page.actions.push({id:f.id,name:f.name,actionType:f.name,posX:f.posX,posY:f.posY,pageId:f.pageId});
                break;
              }
            }
          }
        });
        ev.applyEdges.forEach(e => {
          // Resolve targetField to actual field ID if needed
          if (e.targetField) {
            // Search flat fields first, then nested
            let tf = fullProject.fields.find(f => f.name === e.targetField);
            if (!tf) {
              for (const m of fullProject.modules)
                for (const p of m.pages)
                  { tf = p.fields.find(f => f.name === e.targetField); if (tf) break; }
            }
            if (tf) { e.targetId = tf.id; delete e.targetField; }
          }
          fullProject.edges.push(e);
          createdEdgeIds.push(e.id);
        });
        // Create version commit
        if (!window._srCommits) window._srCommits = []
        const cv = window._srCommits.length + 1
        window._srCommits.push({
          id:'c'+cv, version:cv, message:requirement,
          createdAt:new Date().toISOString(),
          _entities:createdIds,
          _edges:createdEdgeIds,
        });
        const summary = '变更已应用到项目画布';
        return ok({project:fullProject, affectedIds:createdIds, summary});
      }
      // POST /api/inference/apply-impact-status
      if (u.includes('/apply-impact-status')) return ok({status:'processing',message:'正在应用变更…'});
      // POST /api/edges/{pid}/save-positions
      if (u.includes('/save-positions')) return ok({});
      // POST /confirm/{pid} — SSE progress → 100% → result
      if (u.includes('/confirm/') && method==='POST') {
        const pid = u.split('/confirm/')[1].split('/')[0].split('?')[0];
        const encoder = new TextEncoder();
        const stream = new ReadableStream({
          start(controller) {
            const send = (data) => controller.enqueue(encoder.encode('data: '+JSON.stringify(data)+'\n\n'));
            const steps = [
              { progress:10, stage:'processing', message:'正在解析数据…' },
              { progress:30, stage:'processing', message:'正在提取实体关系…' },
              { progress:55, stage:'processing', message:'正在构建知识图谱…' },
              { progress:80, stage:'processing', message:'正在评估变更影响…' },
              { progress:100, stage:'result', message:'梳理完成！', project: fullProject||buildProject(DATA[BKEY]) },
            ];
            let i = 0;
            const intv = setInterval(() => {
              if (i >= steps.length) { clearInterval(intv); controller.close(); return; }
              send(steps[i]); i++;
            }, 300);
          }
        });
        return new Response(stream, {
          status:200,
          headers:{'Content-Type':'text/event-stream','Cache-Control':'no-cache'}
        });
      }
      // Other API calls
      if (u.startsWith(BASE)) return ok({});

      return origFetch(url, opts);
    };

    function ok(data) {
      return Promise.resolve(new Response(JSON.stringify(data), {
        status:200, headers:{'Content-Type':'application/json'}
      }));
    }
    function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

    // Auto‑navigate: find project card by name text and click
    const autoMode = PARAMS.get('redirect') === '1' ? 'fast' : null;
    function tryClickProject(retries) {
      if (retries <= 0) return;
      const name = DATA[BKEY].name;
      // Walk all DOM text nodes looking for the project name
      const walker = document.createTreeWalker(document.body, 4 /* Text */, null, false);
      let node;
      while (node = walker.nextNode()) {
        if (node.textContent.includes(name)) {
          const card = node.parentElement?.closest('[style*="cursor"]') || node.parentElement;
          if (card && typeof card.click === 'function') {
            card.click();
            // Hide save/confirm buttons immediately
            setTimeout(() => {
              document.querySelectorAll('button').forEach(b => {
                const t = b.textContent.trim();
                if (t === '保存' || t === '确认' || t.includes('资产管理')) b.style.display = 'none';
              });
            }, 100);
            return;
          }
        }
      }
      setTimeout(() => tryClickProject(retries - 1), autoMode ? 150 : 400);
    }
    setTimeout(() => tryClickProject(autoMode ? 8 : 25), autoMode ? 50 : 200);

    // ── Persistent UI tweaks (runs every 1.5s) ──
    let _canvasScaled = false;
    setInterval(() => {
      // 1. Hide back button
      document.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('返回大厅')) btn.style.display = 'none';
      });
      const backSvg = document.querySelector('svg[viewBox="0 0 24 24"][width="18"]');
      if (backSvg) { backSvg.style.display = 'none';
        const span = backSvg.parentElement?.querySelector('span');
        if (span) span.style.marginLeft = '0';
      }
      // 2. Hide 资产管理 + 保存 + 确认 (only exact button text match)
      document.querySelectorAll('button').forEach(el => {
        const t = el.textContent.trim();
        if (t === '保存' || t === '确认' || t.includes('资产管理')) el.style.display = 'none';
      });
      // 3. Fit canvas once — use React Flow's fitView dispatch
      if (!_canvasScaled) {
        const rf = document.querySelector('.react-flow');
        if (rf) {
          // Try to find and click the fit view button if it exists
          const fitBtn = rf.querySelector('button[title*="fit"],button[aria-label*="fit"]');
          if (fitBtn) fitBtn.click();
          // Alternative: trigger viewport update via wheel event to force re-render
          rf.dispatchEvent(new WheelEvent('wheel', { deltaY: 1, deltaX: 0 }));
          _canvasScaled = true;
        }
      }
      // 4. Confirm auto-click
      document.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('是，开始推理')) btn.click();
      });
      // 5. Font size
      document.querySelectorAll('*').forEach(el => {
        const fs=parseFloat(getComputedStyle(el).fontSize);
        if(fs>14){const t=el.tagName.toLowerCase();if(['h1','h2','h3','h4','span','div','p','button'].includes(t))el.style.fontSize='13px';}
      });
    }, 800);
    </script>
