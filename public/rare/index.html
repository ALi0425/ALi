    // ── Build full project response (pages/fields/actions ONLY in nested modules, NOT flat) ──
    function buildProject(data) {
      const modules = data.modules.map(m => ({...m,projectId:'proj-1',_count:{pages:m.pages.length,fields:0,actions:0}}));
      let ei = 0;
      const edges = [];
      data.modules.forEach(m => {
        (m.pages||[]).forEach(p => {
          edges.push({id:'e'+(ei++),sourceId:m.id,targetId:p.id,flowType:'has',status:'active',projectId:'proj-1',label:''});
          (p.fields||[]).forEach(f => edges.push({id:'e'+(ei++),sourceId:p.id,targetId:f.id,flowType:'has',status:'active',projectId:'proj-1',label:''}));
          (p.actions||[]).forEach(a => edges.push({id:'e'+(ei++),sourceId:p.id,targetId:a.id,flowType:'has',status:'active',projectId:'proj-1',label:''}));
        });
      });
      return {
        id:'proj-1', name:data.name, description:'', status:'active',
        modules, pages:[], fields:[], actions:[], edges,
        confirmedAt:new Date().toISOString(), /* skip confirm dialog */
        createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
      };
    }

    // ── Fetch interceptor ──
    const origFetch = window.fetch;
    let fullProject = null;
    window.fetch = async (url, opts) => {
      const u = typeof url === 'string' ? url : url.url;
      const method = (opts?.method||'GET');
      let body = {};
      try { if (opts?.body) body = JSON.parse(opts.body); } catch {}

      // GET /api/projects → list
      if (u === BASE+'/projects' && method==='GET') {
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok([{id:'proj-1',name:fullProject.name,description:'',status:'active',createdAt:fullProject.createdAt,updatedAt:fullProject.updatedAt,_count:{modules:fullProject.modules.length,pages:fullProject.pages.length,fields:fullProject.fields.length,actions:fullProject.actions.length}}]);
      }
      // GET /api/projects/{id}
      if (u.match(/\/projects\/[\w-]+$/) && method==='GET') {
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok(fullProject);
      }
      // GET /api/edges/{pid} — return empty, edges come from project data
      if (u.includes('/edges/') && method==='GET') {
        return ok([]);
      }
      // GET /api/commits/{pid} — mock versions
      if (u.includes('/commits/') && method==='GET') {
        return ok([
          {id:'c1',version:1,message:'初始数据注入',createdAt:new Date(Date.now()-86400000).toISOString()},
          {id:'c2',version:2,message:'模块结构梳理',createdAt:new Date(Date.now()-43200000).toISOString()},
          {id:'c3',version:3,message:'字段类型优化',createdAt:new Date(Date.now()-3600000).toISOString()},
        ]);
      }
      // POST /api/parse/{pid}
      if (u.includes('/parse/') && method==='POST') {
        await delay(800);
        return ok({entities:[{name:'新需求',type:'page',parentName:'项目管理'},{name:'影响字段',type:'field',parentName:'新需求',fieldType:'string'}]});
      }
      // POST /api/inference/impact
      if (u.includes('/inference/impact') && method==='POST') {
        await delay(1000);
        return ok({
          impactDescription:'进度管理页面，每个里程碑都会新增一个里程碑状态，用户可以以此来查看每个里程碑的完成情况，便于对项目进度进行把控',
          newEntities:[{name:'里程碑状态',type:'field',parentName:'进度管理',fieldType:'select'}],
          affectedEntities:[
            {name:'进度管理',type:'page',impact:'high',description:'增加里程碑状态字段，可对每个里程碑完成情况进行查看'},
            {name:'执行进度',type:'field',impact:'medium',description:'考虑是否根据里程碑状态字段进行执行进度统计'},
          ],
          newEdges:[
            {sourceName:'进度管理',targetName:'里程碑状态',label:'新增字段',flowType:'extension'},
            {sourceName:'里程碑状态',targetName:'执行进度',label:'状态关联',flowType:'association'},
          ],
        });
      }
      // POST /api/inference/refine — submit refine
      if (u.includes('/inference/refine') && method==='POST') {
        await delay(300);
        return ok({
          refinedText: '在【科技项目管理:module】模块【进度管理:page】页面新增一个{里程碑状态:field}字段，值为未提交、审核中、审核通过、审核退回，当用户编辑保存后，状态为未提交；用户提交后，状态为审核中；当审核节点退回后，状态为审核退回；当所有审核节点都审核通过后，状态为审核通过。',
          entities: [
            {name:'里程碑状态',type:'field',isNew:true,parentName:'进度管理',fieldType:'select'},
            {name:'进度管理',type:'page',isNew:false,parentName:'科技项目管理',impact:'high',description:'增加里程碑状态字段，可对每个里程碑完成情况进行查看'},
            {name:'执行进度',type:'field',isNew:false,parentName:'进度管理',impact:'medium',description:'考虑是否根据里程碑状态字段进行执行进度统计'},
          ],
          newEdges:[
            {sourceName:'进度管理',targetName:'里程碑状态',label:'新增字段',flowType:'extension'},
            {sourceName:'里程碑状态',targetName:'执行进度',label:'状态关联',flowType:'association'},
          ]
        });
      }
      // GET/POST/PATCH/DELETE asset operations
      if (u.includes('/assets/')) {
        if (!fullProject) fullProject = buildProject(DATA[BKEY]);
        return ok({});
      }
      // POST /api/inference/apply-impact
      if (u.includes('/apply-impact')) { await delay(500); return ok({project:fullProject||buildProject(DATA[BKEY]),affectedIds:[],summary:'变更已应用'}); }
      // POST /api/inference/apply-impact-status
      if (u.includes('/apply-impact-status')) return ok({status:'processing',message:'正在应用变更…'});
      // POST /api/edges/{pid}/save-positions
      if (u.includes('/save-positions')) return ok({});
      // POST /confirm/{pid} — SSE progress → 100% → result
      if (u.includes('/confirm/') && method==='POST') {
        const pid = u.split('/confirm/')[1].split('/')[0].split('?')[0];
        const encoder = new TextEncoder();
        const stream = new ReadableStream({
          start(controller) {
            const send = (data) => controller.enqueue(encoder.encode('data: '+JSON.stringify(data)+'\n\n'));
            const steps = [
              { progress:10, stage:'processing', message:'正在解析数据…' },
              { progress:30, stage:'processing', message:'正在提取实体关系…' },
              { progress:55, stage:'processing', message:'正在构建知识图谱…' },
              { progress:80, stage:'processing', message:'正在评估变更影响…' },
              { progress:100, stage:'result', message:'梳理完成！', project: fullProject||buildProject(DATA[BKEY]) },
            ];
            let i = 0;
            const intv = setInterval(() => {
              if (i >= steps.length) { clearInterval(intv); controller.close(); return; }
              send(steps[i]); i++;
            }, 300);
          }
        });
        return new Response(stream, {
          status:200,
          headers:{'Content-Type':'text/event-stream','Cache-Control':'no-cache'}
        });
      }
      // Other API calls
      if (u.startsWith(BASE)) return ok({});

      return origFetch(url, opts);
    };

    function ok(data) {
      return Promise.resolve(new Response(JSON.stringify(data), {
        status:200, headers:{'Content-Type':'application/json'}
      }));
    }
    function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

    // Auto‑navigate: find project card by name text and click
    function tryClickProject(retries) {
      if (retries <= 0) return;
      const name = DATA[BKEY].name;
      // Walk all DOM text nodes looking for the project name
      const walker = document.createTreeWalker(document.body, 4 /* Text */, null, false);
      let node;
      while (node = walker.nextNode()) {
        if (node.textContent.includes(name)) {
          const card = node.parentElement?.closest('[style*="cursor"]') || node.parentElement;
          if (card && typeof card.click === 'function') {
            card.click();
            // Hide save/confirm buttons immediately
            setTimeout(() => {
              document.querySelectorAll('button').forEach(b => {
                const t = b.textContent.trim();
                if (t === '保存' || t === '确认' || t.includes('资产管理')) b.style.display = 'none';
              });
            }, 100);
            return;
          }
        }
      }
      setTimeout(() => tryClickProject(retries - 1), 400);
    }
    setTimeout(() => tryClickProject(25), 200);

    // ── Persistent UI tweaks (runs every 1.5s) ──
    let _canvasScaled = false;
    setInterval(() => {
      // 1. Hide back button
      document.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('返回大厅')) btn.style.display = 'none';
      });
      const backSvg = document.querySelector('svg[viewBox="0 0 24 24"][width="18"]');
      if (backSvg) { backSvg.style.display = 'none';
        const span = backSvg.parentElement?.querySelector('span');
        if (span) span.style.marginLeft = '0';
      }
      // 2. Hide 资产管理 + 保存 + 确认 (only exact button text match)
      document.querySelectorAll('button').forEach(el => {
        const t = el.textContent.trim();
        if (t === '保存' || t === '确认' || t.includes('资产管理')) el.style.display = 'none';
      });
