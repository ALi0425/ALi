<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ali</title>
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⏣</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script>document.documentElement.classList.add('_loading')</script>
    <script type="module" crossorigin src="/ALi/assets/index-ZfDWZRu8.js"></script>
    <link rel="stylesheet" crossorigin href="/ALi/assets/index-BV6oWAo6.css">
  </head>
  <body>
    <!-- ═══ LAYER 1: Physical Grid ═══ -->
    <div
      class="fixed inset-0 pointer-events-none z-0"
      style="
        background-image:
          linear-gradient(to right, #1a1a1a 1px, transparent 1px),
          linear-gradient(to bottom, #1a1a1a 1px, transparent 1px);
        background-size: 4rem 4rem;
        mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 0%, #000 70%, transparent 100%);
      "
    ></div>

    <!-- ═══ LAYER 2: CRT Scanlines ═══ -->
    <div
      class="fixed inset-0 pointer-events-none z-[1] opacity-20"
      style="
        background-image:
          linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%),
          linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
        background-size: 100% 2px, 3px 100%;
      "
    ></div>

    <!-- ═══ LAYER 3: Three.js Canvas Container ═══ -->
    <div id="three-container" class="fixed inset-0 z-[2]"></div>

    <!-- ═══ LAYER 4: UI Overlay ═══ -->
    <div id="ui-overlay" class="fixed inset-0 z-[3] pointer-events-none">
      <!-- Status Bar -->
      <div id="status-bar" class="absolute top-6 left-6"></div>

      <!-- System Info Streaming (bottom-left) -->
      <div
        id="system-info"
        class="absolute bottom-6 left-6 font-mono text-[11px] text-neutral-600 tracking-[0.2em] flex items-center gap-4 opacity-0 transition-opacity duration-1000"
      >
        <span class="text-green-500/60">CURIOSITY: 100%</span>
        <span class="text-neutral-700">|</span>
        <span class="text-green-500/60">TEAMWORK: <span class="text-green-400 animate-pulse">ACTIVE</span></span>
      </div>

      <!-- Guide Hint (bottom-center, further down) -->
      <div
        id="guide-hint"
        class="absolute bottom-16 left-1/2 -translate-x-1/2 font-mono text-[11px] text-neutral-600 tracking-[0.1em] opacity-0 transition-opacity duration-1000"
      >
        <span class="text-neutral-500">请</span>
        <span class="text-green-500/70">开启摄像头并张开手掌</span>
        <span class="text-neutral-500">，或</span>
        <span class="text-green-500/70">双击鼠标</span>
        <span class="text-neutral-500">，解构 KERNEL_MODULES</span>
      </div>

      <!-- Camera indicator -->
      <div
        id="camera-indicator"
        class="absolute top-6 right-6 font-mono text-[10px] text-neutral-700 tracking-widest flex items-center gap-2 opacity-0 transition-all duration-700"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-neutral-700"></span>
        CAMERA: OFFLINE
      </div>
    </div>

  </body>
</html>
